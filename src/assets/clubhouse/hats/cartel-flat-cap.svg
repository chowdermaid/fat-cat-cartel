  <title>Cartel flat cap — portrait accessory</title>
  <desc>Charcoal tweed-inspired flat cap with a short right-facing peak. Transparent background. Crown, side panel, band, brim and seams are independently editable vector groups. No embedded images or fonts. Artwork bounds approximately x27–220, y30–112.</desc>
